# Intel Gaudi 3 AI accelerator (OAM mezzanine card, HL-325L).
# Sources: Intel Gaudi 3 AI Accelerator White Paper (Japanese edition), specification
# comparison table and text, and the HL-325L OAM product brief.
# https://cdrdv2-public.intel.com/817486/gaudi-3-ai-accelerator-white-paper-jp.pdf
# https://cdrdv2-public.intel.com/817487/gaudi-3-ai-accelerator-hl-325l-oam-mezzanine-card-product-brief-jp.pdf
# The English pages on intel.com do not state these numbers; the values were read from
# the PDFs' text layer. Verify them against the English edition when possible.
# Compute figures are the matrix-engine (MME) peaks from the table.

