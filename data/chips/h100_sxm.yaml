# NVIDIA H100 SXM.
# Source: NVIDIA H100 product page, Product Specifications table.
# https://www.nvidia.com/en-us/data-center/h100/
# The page lists Tensor Core TFLOPS "with sparsity". The dense figure is not
# stated on the page, so the compute fields below are the sparse figure divided
# by 2 and are tagged estimated.

name: NVIDIA H100 SXM
specs:
  peak_compute_bf16:
    value: 989.5
    unit: TFLOPS
    source_url: https://www.nvidia.com/en-us/data-center/h100/
    as_of: "2026-11-18"
    confidence: estimated
    note: "Page lists 1,979 TFLOPS with sparsity. Dense assumed to be half."
  peak_compute_fp8:
    value: 1979.0
    unit: TFLOPS
    source_url: https://www.nvidia.com/en-us/data-center/h100/
    as_of: "2026-11-18"
    confidence: estimated
    note: "Page lists 3,958 TFLOPS with sparsity. Dense assumed to be half."
  memory_capacity:
    value: 80.0
    unit: GB
    source_url: https://www.nvidia.com/en-us/data-center/h100/
    as_of: "2026-11-18"
    confidence: published
  memory_bandwidth:
    value: 3.35
    unit: TB/s
    source_url: https://www.nvidia.com/en-us/data-center/h100/
    as_of: "2026-11-18"
    confidence: published
  board_power:
    value: 700.0
    unit: W
    source_url: https://www.nvidia.com/en-us/data-center/h100/
    as_of: "2026-11-18"
    confidence: published
    note: "Page says up to 700 W, configurable."
