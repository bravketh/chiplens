[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chiplens"
version = "1.4.0"
description = "Open-source tradeoff and cost model for AI inference chips, built on cited public specs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.scripts]
chiplens = "chiplens.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
plot = ["matplotlib>=3.8"]
app = ["streamlit>=1.30", "pandas>=2.0", "altair>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/chiplens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes, I: import order, B: likely bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# UI copy and chart specs read better on long lines.
"app/*" = ["E501"]
